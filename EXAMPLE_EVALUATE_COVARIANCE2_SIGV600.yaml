# The DESI DR1 fixed-width Delta z = 0.02 case (90 lens bins) on the
# longer cross-pair list of sigma_v = 600 km/s (219 pairs; case
# dr1_dz0p02_sigv600): EXAMPLE_EVALUATE_COVARIANCE2.yaml with that case.
# Run from cocoa/Cocoa with the project's covariance interface enabled:
# python projects/lssty1xdesi/covariance/compute_covariance.py \
#   projects/lssty1xdesi/EXAMPLE_EVALUATE_COVARIANCE2_SIGV600.yaml
# This evaluates one covariance; it does not start an MCMC sampler.
timing: true
debug: false

theory:
  camb:
    path: ./external_modules/code/CAMB
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.0
      lens_potential_accuracy: 1.0
      k_per_logint: 20
      kmax: 20.0

# Fixed values define the forecast cosmology, the fiducial point of the
# EXAMPLE_EVALUATE yaml files except mnu: the halo forecast behind SSC
# and cNG requires massless neutrinos, and the sub-percent C_l change
# sits far below covariance accuracy. As in the likelihood YAMLs, w0pwa
# is w0+wa and As_1e9 is 10^9 times the primordial scalar amplitude.
params:
  omegam: 0.3
  omegab: 0.04
  H0: 67.32
  ns: 0.96605
  As_1e9: 2.1
  w: -1.0
  w0pwa: -1.0
  mnu: 0.0

sampler:
  evaluate:
    N: 1
    # A parameter with a prior must have an explicit value in override.
    # Fixed parameters above need no override.

covariance:
  # the project measures Fourier bandpowers only
  space: fourier
  # the layout and data files of the case
  case: dr1_dz0p02_sigv600
  # Internal refinements inherit covariance/default.yaml for this survey.
  accuracy_boost: 1
  integration_accuracy: 0
  # Gaussian spectra only; SSC/cNG keep their existing model. The
  # thin lens bins need the redshift distortions (rsd), carried by the
  # Limber window and the non-Limber recompute's j_l'' transfer.
  gaussian:
    nonlimber: true
    rsd: true
    ia: none

output: ./projects/lssty1xdesi/covariance/production_covariance_dr1_dz0p02_sigv600.npz
