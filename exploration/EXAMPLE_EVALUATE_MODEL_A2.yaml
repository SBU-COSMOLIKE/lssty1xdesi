# EXAMPLE_EVALUATE_LINEAR2.yaml (Delta z = 0.02) with the model A bias of notes/higher_order_bias
# (likelihood exploration.desi_cl_dr1_dz0p02_model_a): the model A chunk offsets sit at their fiducial,
# zero, in the evaluate override.
# The DESI DR1 fixed-width Delta z = 0.02 case (90 lens bins):
# scripts/make_desi_dz_case.py builds its files.
timing: True
debug: False
stop_at_error: True

likelihood:
  lssty1xdesi.exploration.desi_cl_dr1_dz0p02_model_a:
    path: ./external_modules/data/lssty1xdesi
    data_file: lssty1xdesi_desi_dr1_dz0p02_linear.dataset
    # band powers at the dataset's explicit centers (Delta ell = 10)
    binning_space: fourier
    # the FoG convolution rebuilds the n(z) at every point
    external_nz_modeling: 1
    print_datavector: False
    print_datavector_file: "./projects/lssty1xdesi/chains/desi_dr1_dz0p02_theory.modelvector"
    accuracyboost: 2 # dz = 0.02 bins: 1 moves chi2 by 0.10
    integration_accuracy: 0
    # Ntable.LMAX: only bounds the low-rank cap in fourier mode
    lmax: 5000
    # P(k) up to kmax_boltzmann x accuracyboost = 40/Mpc (low Omega_m needs the tail)
    kmax_boltzmann: 20.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0
    IA_code: 1
    IA_redshift_evolution: 3
    # thin comoving bins keep real non-Limber power far past ell = 150:
    # the low-rank method computes the full nonlinear density-density
    # term with no Limber hand-off below the cap
    adopt_limber_gg: 0
    nonlimber_lowrank_gg: 1
    nonlimber_lowrank_rank: 5
    nonlimber_lowrank_lmax: 1000
    debug: false

# The amplitude cut: every DESI bias group i keeps
# (A_s/A_s,fid)(b_i/b_i,fid)^2 <= 8, the cut of every project, with A_s the
# primordial amplitude (sampled as As_1e9 = 10^9 A_s) and b_i the group's
# linear galaxy bias (DESI_B1_*). The galaxy power of a bin scales as
# A_s b_i^2. The flat boxes alone reach a ratio of about 50 (the ELG
# fiducial bias is 0.84),
# where the numerical error of the data vector costs many units of chi2 (the
# N-random-models check, tests/data_vector/README.md); the DESI Fisher 2 sigma
# contours reach a ratio of only about 2 (EXAMPLE_EVALUATE_FISHER.ipynb, section 8).
# A point outside the cut has prior -inf, so cobaya never evaluates its
# likelihood.
prior:
  amplitude_cut: "lambda As_1e9, DESI_B1_1, DESI_B1_16, DESI_B1_26, DESI_B1_36, DESI_B1_51, DESI_B1_66: 0.0 if (As_1e9/2.1)*max((DESI_B1_1/1.34)**2, (DESI_B1_16/1.7)**2, (DESI_B1_26/1.7)**2, (DESI_B1_36/1.7)**2, (DESI_B1_51/0.84)**2, (DESI_B1_66/0.84)**2) <= 8 else -np.inf"

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.015
    proposal: 0.015
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.005
    proposal: 0.005
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.2
      max: 0.5
    ref:
      dist: norm
      loc: 0.316
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
    drop: true
  w:
    prior:
      min: -3
      max: -0.33333 # w0 < -1/3: the expansion accelerates today
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    prior:
      min: -3 # w0 + wa > -3: below it the early phantom regime needs a costlier CAMB
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  mnu:
    prior:
      min: 0.06
      max: 0.6
    ref:
      dist: norm
      loc: 0.25
      scale: 0.1
    proposal: 0.05
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # --------------------------------------------------------------------------------------- 
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  yheused:
    latex: Y_P^\mathrm{BBN}
  omegan2:
    latex: \Omega_\mathrm{\\nu} h^2
  omegan:
    derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
    latex: \Omega_\mathrm{\\nu}
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Nuisance parameters below (it overwrites the default settings)
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Intrinsic alignment
theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.05
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 15
      kmax: 7.5
#  NOTE: under TATT with IA_code: 1 the fastpt defaults are the
#  converged two-grid configuration: accuracyboost multiplies the
#  density of the output table cosmolike interpolates (the accuracy
#  driver) and internal_accuracyboost the FFTLog grid, both rebased
#  so 1.0 just works (see tests/README.md, test 15).
#  fastpt:
#    path: ./external_modules/code/FAST-PT
#    extra_args:
#      accuracyboost: 1.0
#      internal_accuracyboost: 1.0
#      kmax_boltzmann: 7.5
#      extrap_kmax: 250.0
  # Baryonic feedback through the bfmt theory block: uncomment to
  # multiply the matter power by a trained suppression model S(k, z).
  # The baryon tests (tests/data_vector/test_baryons.py and
  # test_accuracy_baryons.py) exercise every model against frozen
  # per-method vectors; see external_modules/code/baryon_suppression.
  # bfmt:
  #   baryon_model: 2 # 1 = SP(k), 2 = BCEmu, 3 = FlamingoEmulator, 4 = BACCOemu, 5 = BCemu2025
  #   nz: 20  # internal (z, k) computation grid; the result is 2D-splined
  #   nk: 100 # onto the grid the likelihood requests
  #   above_zmax: unity # S(k,z) above the model range: unity (default) or constant
  #   q2_bcemu25: 0.70 # BCemu2025 only: q2 coordinate (native grid: 0.5, 0.7, 1.0)

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.96605
      H0: 67.32
      omegab: 0.04
      omegam: 0.3
      mnu: 0.06
      w0pwa: -1.0
      w: -1.0
      DESI_B1_1: 1.34
