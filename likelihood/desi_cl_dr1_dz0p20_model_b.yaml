# desi_cl_dr1_dz0p20 with the model B bias of notes/higher_order_bias; every
# option not set here is desi_cl_dr1_dz0p20.yaml's.
higher_order_bias: 2
# model B hands cosmolike every bias per bin, with b3 = 0
bias_model: [0,0,0,0,0,0]
# the linear per-bin fragment and the model B one (offsets per chunk,
# tilts fixed at zero); for the pessimistic variant name
# params_desi_dr1_dz0p20_model_b_pessimistic instead
params: !defaults [params_desi_dr1_dz0p20, params_desi_dr1_dz0p20_model_b]
