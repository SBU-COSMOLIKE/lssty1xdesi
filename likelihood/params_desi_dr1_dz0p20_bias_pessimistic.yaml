# Generated by scripts/make_desi_params.py --bias-pessimistic: the pessimistic linear-bias prior of
# notes/correlated_bias_prior_v2 (section "The linear-bias prior"), sigma_g = 0.03 in every group and L = 0.05.
# Bin n of group g: DESI_B1_<n> = B_g (1 + delta_n), delta_n = s_g (z_n - zbar_g) + eps_n, with
# B_g = DESI_B1_<g> (b1 at z = 0 under a constant clustering amplitude; the likelihood
# divides DESI_B1_<n> by D(z_n)), s_g = DESI_TB1_<g> (flat prior), zbar_g the mean of the group's
# bin redshifts, and eps = sigma_g C u, C the Cholesky factor of exp(-|z_i - z_j|/L) in the
# group and u_n = DESI_UB1_<n> ~ N(0, 1). Groups of one or two bins carry no residuals
# (and one bin no tilt): their bins are free (see emit_bias_pessimistic).
# Velocity dispersions [km/s]: the seven groups of params_desi.yaml, leaders sampled,
# members tied by value.
  DESI_B1_BGS: # amplitude B_g of group BGS
    prior:
      min: 0.8
      max: 4.0
    ref:
      dist: norm
      loc: 1.34
      scale: 0.02
    proposal: 0.02
    latex: B_\mathrm{BGS}
  DESI_TB1_BGS: # tilt s_g of group BGS [per unit z]: +-0.5 of B_g at the outermost bin
    prior:
      min: -7.057
      max: 7.057
    ref:
      dist: norm
      loc: 0.0
      scale: 0.1411
    proposal: 0.1411
    latex: s_\mathrm{BGS}
  # group BGS has two bins: no residuals (B_g and the tilt already free both bins)
  DESI_B1_1: # group BGS
    value: 'lambda DESI_B1_BGS, DESI_TB1_BGS: DESI_B1_BGS*(1.0 + DESI_TB1_BGS*(-7.084750000000001e-02))'
  DESI_B1_2: # group BGS
    value: 'lambda DESI_B1_BGS, DESI_TB1_BGS: DESI_B1_BGS*(1.0 + DESI_TB1_BGS*(+7.084750000000001e-02))'
  DESI_B1_LRG1: # amplitude B_g of group LRG1
