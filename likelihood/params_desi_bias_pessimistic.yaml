# divides DESI_B1_<n> by D(z_n)), s_g = DESI_TB1_<g> (flat prior), zbar_g the mean of the group's
# bin redshifts, and eps = sigma_g C u, C the Cholesky factor of exp(-|z_i - z_j|/L) in the
# group and u_n = DESI_UB1_<n> ~ N(0, 1). Groups of one or two bins carry no residuals
# (and one bin no tilt): their bins are free (see emit_bias_pessimistic).
