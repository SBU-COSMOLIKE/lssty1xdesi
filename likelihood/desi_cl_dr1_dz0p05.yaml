# desi_cl on the DESI DR1 fixed-width Delta z = 0.05 bins (36 lens
# bins), built by scripts/make_desi_dz_case.py; every option not set
# here is desi_cl.yaml's.
data_file: lssty1xdesi_desi_dr1_dz0p05.dataset
# the non-Limber FFTLog chi grid of this binning (see desi_cl.yaml): the
# smallest boost whose delta chi2 against boost 128 stays below 0.01 at
# it and every larger boost (measured 2026-11-04, the case's covariance;
# against 128: 4 -> 26.6, 8 -> 8.0e-3, 16 -> 1.0e-2,
# 32 -> 5.4e-4, 64 -> 1.8e-4); 16 with accuracyboost 2 keeps the
# combined chi-grid factor 32
nonlimber_accuracyboost: 16.0
# cosmolike's table boost: 2, not 1. Across the prior (Omega_m in
# [0.2, 0.5], w0 <= -1/3, w0 + wa >= -3, amplitude cut 3.5) boost 1 lets
# the pushed-settings delta chi2 reach 0.7 (the N-random-models check);
# 2 halves it at most points (2026-11-05)
accuracyboost: 2.0
# P(k) up to kmax_boltzmann x accuracyboost = 40/Mpc: at low Omega_m the
# 10/Mpc table moves chi2 by up to 6 through the extrapolated tail, and
# 40/Mpc brings it to 0.1 (2026-11-05)
kmax_boltzmann: 20.0
params: !defaults [params_desi_dr1_dz0p05]
