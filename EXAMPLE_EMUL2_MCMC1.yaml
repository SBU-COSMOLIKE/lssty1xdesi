timing: True
debug: False
stop_at_error: True

likelihood:
  lssty1xdesi.desi_cl:
    # hybrid emulators (use_emulator = 2): the P(k), distances and
    # H(z) come from the trained emulators below instead of CAMB; the
    # data vector itself is computed exactly, as in the CAMB example
    use_emulator: 2
    path: ./external_modules/data/lssty1xdesi
    data_file: lssty1xdesi_desi_dr3.dataset
    binning_space: fourier
    external_nz_modeling: 1
    print_datavector: False
    print_datavector_file: "./projects/lssty1xdesi/chains/desi_theory_emul2.modelvector"
    accuracyboost: 1
    integration_accuracy: 0
    lmax: 5000
    kmax_boltzmann: 5.0
    non_linear_emul: 2
    IA_model: 0
    IA_code: 0
    IA_redshift_evolution: 3
    adopt_limber_gg: 0
    nonlimber_lowrank_gg: 1
    nonlimber_lowrank_rank: 5
    nonlimber_lowrank_lmax: 1000
    debug: false

# The amplitude cut: every DESI bias group i keeps
# (A_s/A_s,fid)(b_i/b_i,fid)^2 <= 8, the cut of every project, with A_s the
# primordial amplitude (sampled as As_1e9 = 10^9 A_s) and b_i the group's
# linear galaxy bias (DESI_B1_*). The galaxy power of a bin scales as
# A_s b_i^2. The flat boxes alone reach a ratio of about 50 (the ELG
# fiducial bias is 0.84),
# where the numerical error of the data vector costs many units of chi2 (the
# N-random-models check, tests/data_vector/README.md); the DESI Fisher 2 sigma
# contours reach a ratio of only about 2 (EXAMPLE_EVALUATE_FISHER.ipynb, section 8).
# A point outside the cut has prior -inf, so cobaya never evaluates its
# likelihood.
prior:
  amplitude_cut: "lambda As_1e9, DESI_B1_1, DESI_B1_19, DESI_B1_30, DESI_B1_39, DESI_B1_50, DESI_B1_62: 0.0 if (As_1e9/2.1)*max((DESI_B1_1/1.34)**2, (DESI_B1_19/1.7)**2, (DESI_B1_30/1.7)**2, (DESI_B1_39/1.7)**2, (DESI_B1_50/0.84)**2, (DESI_B1_62/0.84)**2) <= 8 else -np.inf"

params: # EE2 PRIORS
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.25
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 5
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
  omegam:
    prior:
      min: 0.2
      max: 0.5
    ref:
      dist: norm
      loc: 0.316
      scale: 0.02
    proposal: 0.02
    latex: \Omega_\mathrm{m}
  w0pwa:
    prior:
      min: -3 # w0 + wa > -3: below it the early phantom regime needs a costlier CAMB
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  w:
    prior:
      min: -3
      max: -0.33333 # w0 < -1/3: the expansion accelerates today
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    derived: false
    latex: 'w_{a,\mathrm{DE}}'
  mnu:
    value: 0.06
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  As:
    value: 'lambda As_1e9: 1e-9*As_1e9'
    latex: 'A_\mathrm{s}'
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Nuisance parameters below (it overwrites the default settings)
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # ------------------------------------------------------------------------
  # Intrinsic alignment
theory:
  emulrdrag:
    path: ./cobaya/cobaya/theories/
    provides: ['rdrag']
    extra_args:
      file: ['external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_rdrag_GP.joblib'] 
      extra: ['external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_rdrag.npy'] 
      ord: [['omegabh2','omegach2']]
  emulbaosn:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    provides: ['comoving_radial_distance', 'angular_diameter_distance', 'Hubble']
    extra_args:
      device: "cpu"
      file:  [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/emul_w0wa_H.pt']
      extra: [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/extra_w0wa_H.npy']    
      ord: [None, ['omegam','H0','w','wa']]
      extrapar: [{'MLA': 'INT', 'ZMIN' : 0.0001, 'ZMAX' : 3, 'NZ' : 600},
                 {'MLA': 'ResMLP', 'offset' : 0.0, 'INTDIM' : 4, 'NLAYER' : 6,
                  'TMAT': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/PCA_w0wa_H.npy',
                  'ZLIN': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/z_lin_w0wa.npy'}]
  emulmps:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args:
      model_file:    "external_modules/data/emultrf/emulmps/npce_emul/emulator_npce.keras"
      metadata_file: "external_modules/data/emultrf/emulmps/npce_emul/metadata.joblib"
      nl_model_file:    "external_modules/data/emultrf/emulmps/w0wa_halofit/emulator_halofit.keras"
      nl_metadata_file: "external_modules/data/emultrf/emulmps/w0wa_halofit/metadata.joblib"
      use_syren: False
      param_order: ["As_1e9", "ns", "H0", "omegab", "omegam", 'w', 'wa']
sampler:
  mcmc:
    # no slow/fast blocking: this likelihood recomputes its whole
    # cosmolike side at every point (the FoG convolution and the
    # decomposition depend on the nuisance parameters), so every
    # parameter costs the same ~2-3 s evaluation and a speed hierarchy
    # buys nothing. One flat block, no dragging, no oversampling.
    measure_speeds: False
    drag: False
    oversample_power: 0
    covmat:
    covmat_params:
    learn_proposal: True
    learn_proposal_Rminus1_min: 0.035
    learn_proposal_Rminus1_max: 150
    learn_proposal_Rminus1_max_early: 300.
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    learn_every: 10d
    max_tries: .inf
    burn_in: 0
    Rminus1_single_split: 4

output: ./projects/lssty1xdesi/chains/EXAMPLE_EMUL2_MCMC1
