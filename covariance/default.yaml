# Covariance accuracy is separate from likelihood accuracy.
# The global boost refines interpolation tables and multipole cutoffs.
accuracy_boost: 1
ell_max: 100000
mask_ell_max: 32768

# Intervals, not points: doubling retains the old table samples.
ng_ell_intervals: 127
non_gaussian_accuracyboost: 1
window_accuracyboost: 1
core_accuracyboost: 1

# Natural cubic preparation: 1500 CAMB k nodes become 11993; C lookup
# remains linear. The global boost multiplies these interval subdivisions.
power_accuracyboost: 8
response_step: 0.00005

# Independent integration level: 0/1/2/3/4 selects the precomputed GSL
# 96/128/256/512/1024-node rule. The global boost never changes that rule.
# The Wynn low-mass tail uses 32/64/128/256/512 nodes at these levels.
# Other rules require at least 64 nodes; generated rules are unsupported.
# Level zero is being checked against refined full-matrix calculations.
integration_accuracy: 0

# Gaussian gg/gs non-Limber resolution, separate from GSL quadrature.
# The global boost multiplies both this cutoff and the radial intervals.
# The thin comoving lens bins need a finer log-distance grid than wide
# photometric bins: the cross spectrum of two adjacent bins comes from
# the overlap of their smeared edges. nonlimber_accuracyboost = 2 (8193
# log-distance samples) is the smallest value that resolves it. Against
# 8x finer grids, the kept cross bandpowers then agree to 0.4% (5-95%)
# in all four DESI cases, the masked Gaussian diagonal to 0.4% and
# FoM(w0, wa) to 1e-4. With 4097 samples the crosses were off by up to
# 15-30% (5-95% range), the diagonal by up to 10% and FoM by up to 0.3%.
# Raising the GSL radial rule (integration_accuracy 1 to 3) moved these
# quantities by less than 1%.
nonlimber_lmax: 1000
nonlimber_accuracyboost: 2
